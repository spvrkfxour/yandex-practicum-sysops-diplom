---
# tasks file for backup
- name: Install backup packages
  ansible.builtin.apt:
    name: "{{ backup_packages }}"
    state: present
    update_cache: true

- name: Ensure backup directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ backup_root_dir }}"
    - "{{ backup_db_dir }}"
    - "{{ backup_fs_dir }}"
    - "{{ backup_script_dir }}"
    - "{{ backup_log_dir }}"
    - "/root/.ssh"

- name: Generate SSH key for backup host if absent
  ansible.builtin.command: >
    ssh-keygen -t ed25519 -f {{ backup_ssh_key_path }} -N ''
  args:
    creates: "{{ backup_ssh_key_path }}"

- name: Read backup host public key
  ansible.builtin.slurp:
    src: "{{ backup_ssh_key_path }}.pub"
  register: backup_pubkey_raw

- name: Set decoded backup public key fact
  ansible.builtin.set_fact:
    backup_pubkey: "{{ backup_pubkey_raw.content | b64decode | trim }}"

- name: Ensure .ssh directory exists on db-primary
  ansible.builtin.file:
    path: "/home/{{ backup_ssh_user }}/.ssh"
    state: directory
    owner: "{{ backup_ssh_user }}"
    group: "{{ backup_ssh_user}}"
    mode: "0700"
  delegate_to: "{{ groups['db_primary'][0] }}"
  become: true

- name: Ensure backup key is authorized on db-primary
  ansible.builtin.lineinfile:
    path: "/home/{{ backup_ssh_user }}/.ssh/authorized_keys"
    line: "{{ backup_pubkey }}"
    create: true
    owner: "{{ backup_ssh_user }}"
    group: "{{ backup_ssh_user }}"
    mode: "0600"
    state: present
  delegate_to: "{{ groups['db_primary'][0] }}"
  become: true

- name: Ensure .ssh directory exists on mediawiki-1
  ansible.builtin.file:
    path: "/home/{{ backup_ssh_user }}/.ssh"
    state: directory
    owner: "{{ backup_ssh_user }}"
    group: "{{ backup_ssh_user }}"
    mode: "0700"
  delegate_to: "{{ groups['mediawiki_1'][0] }}"
  become: true

- name: Ensure backup key is authorized on mediawiki-1
  ansible.builtin.lineinfile:
    path: "/home/{{ backup_ssh_user }}/.ssh/authorized_keys"
    line: "{{ backup_pubkey }}"
    create: true
    owner: "{{ backup_ssh_user }}"
    group: "{{ backup_ssh_user }}"
    mode: "0600"
    state: present
  delegate_to: "{{ groups['mediawiki_1'][0] }}"
  become: true

- name: Deploy PostgreSQL backup script
  ansible.builtin.template:
    src: backup_db.sh.j2
    dest: "{{ backup_script_dir }}/backup_db.sh"
    owner: root
    group: root
    mode: "0750"

- name: Deploy MediaWiki filesystem backup script
  ansible.builtin.template:
    src: backup_mediawiki_fs.sh.j2
    dest: "{{ backup_script_dir }}/backup_mediawiki_fs.sh"
    owner: root
    group: root
    mode: "0750"

- name: Create cron job for PostgreSQL backup
  ansible.builtin.cron:
    name: "PostgreSQL backup"
    user: root
    minute: "{{ backup_db_schedule_minute }}"
    hour: "{{ backup_db_schedule_hour }}"
    job: "{{ backup_script_dir }}/backup_db.sh >> {{ backup_log_dir }}/backup_db.log 2>&1"

- name: Create cron job for MediaWiki filesystem backup
  ansible.builtin.cron:
    name: "MediaWiki filesystem backup"
    user: root
    minute: "{{ backup_fs_schedule_minute }}"
    hour: "{{ backup_fs_schedule_hour }}"
    job: "{{ backup_script_dir }}/backup_mediawiki_fs.sh >> {{ backup_log_dir }}/backup_mediawiki_fs.log 2>&1"

- name: Run PostgreSQL backup script once
  ansible.builtin.command: "{{ backup_script_dir }}/backup_db.sh"
  changed_when: true

- name: Run MediaWiki filesystem backup script once
  ansible.builtin.command: "{{ backup_script_dir }}/backup_mediawiki_fs.sh"
  changed_when: true
